name: Feature request
description: Suggest an idea or an API improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the UI / interaction and why the current API makes it hard.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Optional. What would the API or behaviour look like?
