name: Release

# On main: opens / updates a "Version Packages" PR from pending changesets;
# merging that PR publishes to npm and creates a GitHub release.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: github.repository == 'xeolab/vue-spatial-navi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: true
